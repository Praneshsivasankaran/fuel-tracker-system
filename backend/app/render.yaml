databases:
  - name: fuel-tracker-db
    plan: free
    databaseName: fuel_tracker_db
    user: fuel_tracker_user

services:
  - type: web
    name: fuel-tracker-api
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuel-tracker-db
          property: connectionURI